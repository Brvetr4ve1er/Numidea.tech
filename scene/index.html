<!doctype html>
<html lang="fr" dir="ltr" data-theme="arcanum">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numidea Labs — Les projets, planche par planche</title>
<meta name="description" content="Le travail de Numidea Labs présenté comme un plan d'ingénierie : planches, cotes, et statuts honnêtes.">
<meta name="theme-color" content="#0A1420">
<meta name="color-scheme" content="dark light">
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem('numidea-theme')||'arcanum';var l=localStorage.getItem('numidea-lang')||'fr';d.lang=l;d.dir=l==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202607282330">
</head>
<body>
<div class="runway" id="runway"></div>

<div class="sheet">
  <!-- drafting paper -->
  <div class="grid-fine" aria-hidden="true"></div>
  <div class="grid-coarse" id="gridCoarse" aria-hidden="true"></div>
  <div class="sheet-border" aria-hidden="true"></div>

  <!-- axonometric wireframe scaffolding — pure line art -->
  <svg class="scaffold" id="scaffold" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g class="ax" id="axGroup"></g>
  </svg>

  <!-- the plate: a FLAT screenshot, never rotated, so it stays razor sharp -->
  <div class="platewrap" id="platewrap">
    <div class="plate" id="plate">
      <span class="tick tl"></span><span class="tick tr"></span>
      <span class="tick bl"></span><span class="tick br"></span>
      <img id="shot" src="../assets/previews/bordjsteel.webp" alt="">
      <!-- shown instead of a screenshot when a sheet is still in preparation -->
      <div class="inprep" id="inprep" hidden>
        <span class="hatch" aria-hidden="true"></span>
        <span class="stamp" id="stampTxt">PLANCHE EN PRÉPARATION</span>
        <span class="stamp-sub" id="stampSub">aucune capture — le statut reste honnête</span>
      </div>
      <span class="plate-wipe" id="wipe"></span>
      <span class="plate-scan" aria-hidden="true"></span>
    </div>
    <div class="dim dim-w"><span class="ln"></span><span class="lbl">1280 px</span><span class="ln"></span></div>
    <div class="dim dim-h"><span class="ln"></span><span class="lbl">800</span><span class="ln"></span></div>
  </div>

  <!-- callout on a leader line -->
  <div class="callout" id="callout">
    <span class="cnum" id="cNum">01</span>
    <div class="cbody">
      <div class="ckick" id="cKick"></div>
      <h1 class="cname" id="cName"></h1>
      <p class="ccopy" id="cCopy"></p>
      <a class="clink" id="cLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <!-- header -->
  <nav class="hud">
    <a href="../" class="hud-logo"><span class="d">◆</span> NUMIDEA LABS</a>
    <span class="hud-tag" id="hudTag"></span>
    <span class="sp"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="ar" aria-pressed="false" lang="ar">ع</button>
    </div>
  </nav>

  <!-- sheet index rail -->
  <div class="rail" id="rail" role="group" aria-label="Sheets"></div>

  <!-- engineering title block -->
  <div class="titleblock">
    <div class="tb-row"><span id="lblProject"></span><b id="tbName"></b></div>
    <div class="tb-row"><span id="lblSheet"></span><b><span id="tbN">01</span> / <span id="tbT">7</span></b></div>
    <div class="tb-row"><span id="lblSector"></span><b id="tbSector"></b></div>
    <div class="tb-row"><span id="lblStatus"></span><b id="tbStatus"></b></div>
    <div class="tb-row"><span id="lblDrawn"></span><b>NUMIDEA LABS · BBA</b></div>
  </div>

  <p class="cue" id="cue"></p>
</div>

<script src="app.js?v=202607282330" defer></script>
</body>
</html>
