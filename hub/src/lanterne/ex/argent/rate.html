<p class="st-ls__d" data-i18n="money.ls.items.2.d"></p>

    <label class="st-calc__l" for="rate-net" data-i18n="money.ls.items.2.f.net"></label><input class="st-calc__i" id="rate-net" type="number" inputmode="numeric" min="0" step="1000" value="100000" data-f="net">

    <p><output class="st-calc__mid" dir="ltr" data-o="hour">1 786</output> <span data-i18n="money.ls.items.2.f.hour"></span></p>
