<!-- ---------------- case 05 · Heetch ----------------
     The owner's CaseHeetch (2026-11-07), as a fragment the build inlines at
     09 Proof; its copy is hub/src/cases/heetch.i18n.json, its sheet
     hub/css/case-heetch.css. This is the founder's work as an employee, not
     a Numidea client: the cover says so ("YASSER × HEETCH", "depuis mai
     2026"). The shell's hooks (hub/app.js 8) do the rest: the track, the
     six kinds of deliverable and their badges, the poster viewer, the
     "turn" slider.
     What changed from the design, and why: the header's "temps plein" and
     the end card's "Temps plein" became the case's tag and "Chez Heetch
     depuis mai 2026" (the CV gives the role and the month, not the hours);
     "lancement Heetch Pro" is gone from the sentence and from the list (the
     CV does not say it); the posters are published, the mockups are
     concepts and say so; the "copy the code, -50 %" button is a plain line
     of type, because it would present someone else's promotion as live;
     the planner is radios and CSS (no script: the pill you pick is the
     state), and the posters' wipe is a keyframe on the one that shows. -->
