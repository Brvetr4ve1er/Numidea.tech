<!-- ---------------- case 02 · Alliance Travel ----------------
     The owner's CaseAllianceTravel (2026-11-07), as a fragment the build
     inlines at 09 Proof; its copy is hub/src/cases/alliance.i18n.json, its
     sheet hub/css/case-alliance.css. The shell's hooks (hub/app.js 8) do
     the rest: the track, the eight kinds of deliverable and their badges,
     the trip calculator (tabs for the destination, a stepper for the
     travellers), the poster viewer.
     What changed from the design, and why: the header's price chip and the
     pack's price became the case's tag and a list of what was delivered
     (no client price is published), and the calculator says "sur devis"
     for every trip (the agency's prices are its own); the live view of the
     client's site is a link (the page's CSP frames nothing from another
     host), to the address the home links; the data tile's "178 textes
     traduits" and "AVIF" became what the site's own sheet (scene/) says:
     nine pages, the visa service, the day-by-day programmes, light and
     dark; the cover drops "par une seule équipe" (one founder) and the
     chips the site does not carry (Omra, Billetterie); the type line names
     the faces the client's site uses (DM Sans, Tajawal), as scene/ does;
     the pictures that are mises en situation say MAQUETTE; the brand
     charter is a 21-page flipbook, the Canva carousel has its four slides
     and the calculator its seven destinations (every trip stays "sur devis"). -->
