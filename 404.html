<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Cette page a pris la route · Numidea Labs</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F4EF">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=202608032141">
<script>
/* GitHub Pages serves this page for ANY missing URL, at any depth — relative
   hrefs would then resolve wrong. Recompute the site root (repo subpath on
   *.github.io, "/" everywhere else) and rewrite the few refs this page has. */
(function () {
  if (location.protocol.indexOf('http') !== 0) return; // keep relative for file:// preview
  var seg = location.pathname.split('/').filter(Boolean);
  var root = location.hostname.slice(-10) === '.github.io' && seg.length ? '/' + seg[0] + '/' : '/';
  // <link> tags sit above this script — fix them now, before first paint
  document.querySelectorAll('link[href^="assets/"]').forEach(function (el) {
    el.setAttribute('href', root + el.getAttribute('href'));
  });
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[href="index.html"]').forEach(function (el) {
      el.setAttribute('href', root);
    });
  });
})();
</script>
</head>
<body>
<div class="wrap e404">
  <a class="logo brand" href="index.html">Num<i>idea</i> Labs<span class="brick" aria-hidden="true">DZ</span></a>
  <div>
    <div class="mark">404</div>
    <p class="lines">
      <span class="fr">Rien ici. Ça arrive.</span><br>
      Nothing here. That's fine.
      <span class="ar">لا شيء هنا. لا بأس.</span>
    </p>
    <a class="btn btn-primary cta" href="index.html">Retour à l'accueil</a>
  </div>
</div>
</body>
</html>
