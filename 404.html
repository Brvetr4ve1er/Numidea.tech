     browser's preload scanner does that before any script runs). This
     script writes the page's links from the site root (the repository
     subpath on *.github.io, "/" everywhere else) before first paint. The
     <noscript> copy, for JavaScript off, is relative here so the file
     previews from disk; staging rewrites it and the two home links to the
     site root (scripts/lib/stage-404.mjs), so the published page is styled
     with JavaScript off at any depth too. -->
<script>
(function () {
  var b = 'assets/';   // stays relative for a file:// preview
  if (location.protocol.indexOf('http') === 0) {
    var seg = location.pathname.split('/').filter(Boolean);
    b = (location.hostname.slice(-10) === '.github.io' && seg.length ? '/' + seg[0] + '/' : '/') + 'assets/';
  }
  // \x3c, not "<": the parser must never read these strings as tags (index.html)
  var h = '\x3clink rel="icon" type="image/svg+xml" href="' + b + 'favicon.svg">';
  // iOS ignores the SVG and takes the 180px PNG for the home screen
  h += '\x3clink rel="apple-touch-icon" href="' + b + 'apple-touch-icon.png">';
  // the faces every theme paints first: the copy (Geist) and the buttons
  // (Geist Mono), each variable, one file for every weight. The numeral's
  // face is the theme's heading face, preloaded by the script below once
  // the theme is known; the wordmark is drawn.
  ['geist-latin', 'geist-mono-latin'].forEach(function (f) {
    h += '\x3clink rel="preload" as="font" type="font/woff2" crossorigin href="' + b + 'fonts/' + f + '.woff2">';

  // so the French and English 404 draw it in Plex and not in whatever the
  // system has, without fetching the 42 KB face. The name is private to this page.

    h += '\x3clink rel="stylesheet" href="' + b + f + '">';
  });
  document.write(h);
})();
</script>

<script>
/* GitHub Pages serves this page for ANY missing URL, at any depth — relative
   hrefs would then resolve wrong. The links in <head> are written from the
   site root by the script above; this one points the way home there too.
   Then follow the visitor: their theme (validated — an unknown name would
   leave every token undefined) and their language: ?lang= in the link
   first, as on every other page, then the stored choice. All three
   languages are always on the page; html[lang] decides which button label
   shows, so no text is swapped after paint. HEAD is each theme's heading
   face (themes.css --font-head + --head-weight), the numeral's, kept in
   step by themes-check as index.html's map is; VOID is each theme's page
   colour (themes.css --void), for the browser's own bar. */
(function () {
  var d = document.documentElement;
  var HEAD = { arcanum: 'cinzel-700-latin', daylight: 'cinzel-700-latin' };
  var VOID = { arcanum: '#0A1420', daylight: '#F6F3EC' };
  var TITLE = { fr: 'Cette page a pris la route — Numidea Labs',
                en: 'This page hit the road — Numidea Labs',
                ar: 'هذه الصفحة شدّت الرحال — Numidea Labs' };
  var th = 'arcanum', lang = 'fr', q = '';
  try { q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(); } catch (e) {}
  var st = null;
  try { st = localStorage.getItem('numidea-theme'); lang = localStorage.getItem('numidea-lang') || lang; } catch (e) {}
  if (Object.prototype.hasOwnProperty.call(TITLE, q)) {
    lang = q;
    // kept, as the other pages keep it: the way home stays in this language
    try { localStorage.setItem('numidea-lang', q); } catch (e) {}
  }
  // The language of the dead link itself: a first-time visitor on /en/old or
  // /ar/old is kept in it (after ?lang=, which names the language outright,
  // and over a stored choice, which may be older than the link they followed).
  var root = 'assets/', base = '', fromPath = false;
  if (location.protocol.indexOf('http') === 0) {   // keep relative for file:// preview
    var seg = location.pathname.split('/').filter(Boolean);
    base = location.hostname.slice(-10) === '.github.io' && seg.length ? '/' + seg.shift() + '/' : '/';
    root = base + 'assets/';
    if (!Object.prototype.hasOwnProperty.call(TITLE, q) && (seg[0] === 'en' || seg[0] === 'ar')) { lang = seg[0]; fromPath = true; }
  }
  /* the stored choice if it is one of the two; a retired theme's name becomes
     Arcanum and is rewritten; nothing valid stored: the OS decides (Daylight
     when it asks for light) and nothing is written, since no choice was made */
  if (Object.prototype.hasOwnProperty.call(HEAD, st)) th = st;
  else if (/^(noir|mono|altneon|engineering)$/.test(st)) { try { localStorage.setItem('numidea-theme', th); } catch (e) {} }
  else { try { if (window.matchMedia('(prefers-color-scheme: light)').matches) th = 'daylight'; } catch (e) {} }

  if (bar) bar.setAttribute('content', VOID[th]);

    var home = base + (fromPath ? lang + '/' : '');
    document.addEventListener('DOMContentLoaded', function () {

  if (HEAD[th] !== 'geist-latin') {
    document.write('\x3clink rel="preload" as="font" type="font/woff2" crossorigin href="' + root + 'fonts/' + HEAD[th] + '.woff2">');
  }
})();
