<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="arcanum">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-1TU9AvJcfT5VTAM01sKsm5DJLl+7G52fB5VWQXYiTOM=' 'sha256-MMmWCuvtSA/HIVoXFRQsdFv2tQhqpRRERXu0jEkbJXY='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action mailto:">
<title>404 — Cette page a pris la route · Numidea Labs</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1420">
<!-- GitHub Pages serves this page for any missing URL, at any depth, so a
     relative assets/ link would first be fetched from the wrong folder (the
     browser's preload scanner does that before any script runs). This
     script writes the page's links from the site root (the repository
     subpath on *.github.io, "/" everywhere else) before first paint. The
     <noscript> copy, for JavaScript off, is relative here so the file
     previews from disk; staging rewrites it and the two home links to the
     site root (scripts/lib/stage-404.mjs), so the published page is styled
     with JavaScript off at any depth too. -->
<script>
(function () {
  var b = 'assets/';   // stays relative for a file:// preview
  if (location.protocol.indexOf('http') === 0) {
    var seg = location.pathname.split('/').filter(Boolean);
    b = (location.hostname.slice(-10) === '.github.io' && seg.length ? '/' + seg[0] + '/' : '/') + 'assets/';
  }
  // \x3c, not "<": the parser must never read these strings as tags (index.html)
  var h = '\x3clink rel="icon" type="image/svg+xml" href="' + b + 'favicon.svg">';
  // the faces the page paints first: numeral, copy and "idea" (Geist 500, 400
  // and 600), wordmark, button (Geist Mono 700). Geist and Geist Mono are
  // variable, one file for every weight, so each is preloaded once.
  ['geist-latin', 'cinzel-700-latin', 'geist-mono-latin'].forEach(function (f) {
    h += '\x3clink rel="preload" as="font" type="font/woff2" crossorigin href="' + b + 'fonts/' + f + '.woff2">';
  });
  // themes first: theme blocks are :root[data-theme] (0,2,0); styles.css only reads them
  ['fonts.css?v=202610262127', 'themes.css?v=202610262127', 'styles.css?v=202610262127'].forEach(function (f) {
    h += '\x3clink rel="stylesheet" href="' + b + f + '">';
  });
  document.write(h);
})();
</script>
<noscript>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fonts.css?v=202610262127">
<link rel="stylesheet" href="assets/themes.css?v=202610262127">
<link rel="stylesheet" href="assets/styles.css?v=202610262127">
</noscript>
<style>
  /* svh, not vh: with viewport-fit=cover, 100vh is the tallest the viewport
     ever gets, so the page overflows by the height of the browser chrome
     even when the content fits. */
  /* The centred item is full width, so a font swap changing the numeral's
     width can no longer resize it. */
  .e404>main{width:100%}
  .e404{min-height:100svh;display:grid;place-items:center;text-align:center;
        padding:calc(var(--s-9) + env(safe-area-inset-top)) var(--gutter) calc(var(--s-7) + env(safe-area-inset-bottom))}
  /* Solid ink. This block is inline in the page, so it escaped both passes over
     assets/styles.css — the numeral was still the one gradient-filled string
     left on the site, with the same contrast blind spot (axe skips
     color:transparent) as the headline it was swept out of. */
  .e404 .mark{font-family:var(--font-display);font-weight:500;font-size:clamp(96px,22vw,260px);line-height:.9;letter-spacing:-.03em;
    color:var(--ice)}
  /* em, not ch: 34ch measured 22.53em in Geist, and ch is a font metric — it
     changed when the webfont landed and widened <main> by 54px (CLS 0.0063). */
  .e404 .lines{max-width:22.53em;margin:var(--s-6) auto 0;color:var(--muted);font-size:clamp(16px,1.8vw,20px);line-height:1.6}
  .e404 .lines .fr{color:var(--ice)}
  .e404 .lines .ar{font-family:var(--font-ar-body);direction:rtl;display:block;margin-top:8px}
  .e404 .cta{margin-top:var(--s-7);display:inline-flex}
  /* one label per language, chosen by html[lang] (set before paint) */
  .e404 .cta>[lang],.e404 .sr-only>[lang]{display:none}
  html[lang="fr"] .e404 :is(.cta,.sr-only)>[lang="fr"],html[lang="en"] .e404 :is(.cta,.sr-only)>[lang="en"],html[lang="ar"] .e404 :is(.cta,.sr-only)>[lang="ar"]{display:inline}
  .e404 .brand{position:fixed;top:calc(var(--s-6) + env(safe-area-inset-top));left:50%;transform:translateX(-50%)}
  /* On a short viewport the fixed brand is out of flow, so centred content
     scrolled straight underneath it — the 404 numeral vanished behind the
     wordmark at 844x390. Put the brand back in the flow and stop centring. */
  @media (max-height:620px){
    .e404{min-height:auto;place-items:start center;padding-block:24px 32px}
    .e404 .brand{position:static;transform:none;margin-bottom:var(--s-5)}
    .e404 .mark{font-size:clamp(64px,16vw,120px)}
    .e404 .lines{margin-top:var(--s-4)}
    .e404 .cta{margin-top:var(--s-5)}
  }
</style>
<script>
/* GitHub Pages serves this page for ANY missing URL, at any depth — relative
   hrefs would then resolve wrong. The links in <head> are written from the
   site root by the script above; this one points the way home there too.
   Then follow the visitor: their theme (validated — an unknown name would
   leave every token undefined) and their language: ?lang= in the link
   first, as on every other page, then the stored choice. All three
   languages are always on the page; html[lang] decides which button label
   shows, so no text is swapped after paint. LOGO is each theme's wordmark
   face (themes.css --font-logo + --logo-weight), kept in step by
   themes-check; VOID is each theme's page colour (themes.css --void), for
   the browser's own bar. */
(function () {
  var d = document.documentElement;
  var LOGO = { arcanum: 'cinzel-700-latin', noir: 'geist-latin', daylight: 'geist-latin',
               mono: 'geist-latin', altneon: 'geist-latin', engineering: 'geist-latin' };
  var VOID = { arcanum: '#0A1420', noir: '#0B0B0E', daylight: '#F6F3EC',
               mono: '#0A0A0A', altneon: '#0C0716', engineering: '#0E1012' };
  var TITLE = { fr: '404 — Cette page a pris la route · Numidea Labs',
                en: '404 — This page hit the road · Numidea Labs',
                ar: '404 — هذه الصفحة شدّت الرحال · Numidea Labs' };
  var th = 'arcanum', lang = 'fr', q = '';
  try { q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(); } catch (e) {}
  try { th = localStorage.getItem('numidea-theme') || th; lang = localStorage.getItem('numidea-lang') || lang; } catch (e) {}
  if (Object.prototype.hasOwnProperty.call(TITLE, q)) {
    lang = q;
    // kept, as the other pages keep it: the way home stays in this language
    try { localStorage.setItem('numidea-lang', q); } catch (e) {}
  }
  if (!Object.prototype.hasOwnProperty.call(LOGO, th)) th = 'arcanum';
  if (!Object.prototype.hasOwnProperty.call(TITLE, lang)) lang = 'fr';
  d.setAttribute('data-theme', th);
  d.setAttribute('lang', lang);
  d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.title = TITLE[lang];
  var bar = document.querySelector('meta[name="theme-color"]');
  if (bar) bar.setAttribute('content', VOID[th]);

  var root = 'assets/';
  if (location.protocol.indexOf('http') === 0) {   // keep relative for file:// preview
    var seg = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.slice(-10) === '.github.io' && seg.length ? '/' + seg[0] + '/' : '/';
    root = base + 'assets/';
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('a[href="index.html"]').forEach(function (el) { el.setAttribute('href', base); });
    });
  }
  // a wordmark face the script above has not preloaded already
  if (LOGO[th] !== 'cinzel-700-latin' && LOGO[th] !== 'geist-latin') {
    document.write('\x3clink rel="preload" as="font" type="font/woff2" crossorigin href="' + root + 'fonts/' + LOGO[th] + '.woff2">');
  }
})();
</script>
</head>
<body>
<div class="wrap e404">
  <header>
    <a class="logo brand" href="index.html">Num<i>idea</i> Labs<span class="cursor" aria-hidden="true"></span></a>
  </header>
  <main>
    <!-- The big 404 is this page's heading, so it is one: a page with no h1 and
         no landmark leaves a screen-reader user nothing to navigate by. The
         visible glyph carries the number; the sr-only span carries the sentence
         that makes it a heading rather than a bare figure. -->
    <h1 class="mark">404<span class="sr-only"> — <span lang="fr">page introuvable</span><span lang="en">page not found</span><span lang="ar">الصفحة غير موجودة</span></span></h1>
    <p class="lines">
      <span class="fr" lang="fr" dir="ltr">Cette page a pris la route.</span><br>
      <span lang="en" dir="ltr">This one hit the road.</span>
      <span class="ar" lang="ar" dir="rtl">هذه الصفحة شدّت الرحال.</span>
    </p>
    <a class="btn btn-primary cta" href="index.html"><span lang="fr">← Retour à l'accueil</span><span lang="en">← Back to the home page</span><span lang="ar">→ العودة إلى الرئيسية</span></a>
  </main>
</div>
</body>
</html>
