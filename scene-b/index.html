<!doctype html>
<html lang="en" dir="ltr" data-theme="arcanum">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numidea Labs — Approach B · Baked mockup</title>
<meta name="description" content="Prototype B — a product-shot device with baked lighting, contact shadow and screen bloom.">
<meta name="color-scheme" content="dark light">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('numidea-theme')||'arcanum';}catch(e){document.documentElement.dataset.theme='arcanum';}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="runway" id="runway"></div>

<div class="stagewrap">
  <!-- studio backdrop: a lit sweep, not a flat colour -->
  <div class="backdrop" aria-hidden="true"></div>
  <div class="keylight" id="keylight" aria-hidden="true"></div>

  <div class="rig" id="rig">
    <!-- screen bloom spills onto the scene, tinted by the project accent -->
    <div class="bloom" id="bloom" aria-hidden="true"></div>

    <!-- floor reflection (mirrored copy, faded + blurred) -->
    <div class="reflection" aria-hidden="true">
      <div class="device refl">
        <div class="lid">
          <div class="panel"><img id="reflShot" src="../assets/previews/bordjsteel.webp" alt=""></div>
        </div>
        <div class="deck"></div>
      </div>
    </div>

    <!-- contact shadow, grounded under the deck -->
    <div class="contact" aria-hidden="true"></div>

    <div class="device" id="device">
      <div class="lid">
        <div class="bezel">
          <span class="cam"></span>
          <div class="panel">
            <img id="shot" src="../assets/previews/bordjsteel.webp" alt="Project preview">
            <div class="scr-dim" id="scrDim"></div>
            <div class="glass"></div>
          </div>
        </div>
        <span class="lid-edge"></span>
      </div>
      <div class="deck">
        <span class="deck-lip"></span>
        <span class="trackpad"></span>
      </div>
    </div>
  </div>

  <!-- caption -->
  <div class="cap" id="cap">
    <div class="cap-kick" id="capKick">01 · STEEL · B2B</div>
    <h1 class="cap-name" id="capName">Bordj Steel</h1>
    <p class="cap-copy" id="capCopy">A structural-steel manufacturer, invisible online. We built the full B2B corporate site.</p>
    <a class="cap-link" id="capLink" href="https://bordjsteelb2b.netlify.app" target="_blank" rel="noopener">visit live ↗</a>
  </div>

  <!-- hud -->
  <nav class="hud">
    <a href="../" class="hud-logo"><span class="d">◆</span> NUMIDEA LABS</a>
    <span class="hud-tag">APPROACH B — BAKED MOCKUP</span>
    <span class="sp"></span>
    <span class="hud-idx"><b id="hudN">01</b> / <span id="hudT">5</span></span>
  </nav>
  <div class="hud-line"><div class="hud-fill" id="hudFill"></div></div>
  <div class="dots" id="dots"></div>
  <p class="scrollcue" id="cue">SCROLL ↓</p>
</div>

<div class="cmp" role="group" aria-label="Prototypes">
  <span class="cmp-l">RENDER</span>
  <a href="../scene/" class="cmp-i">css-3d</a>
  <span class="cmp-i active">B · baked</span>
  <a href="../scene-c/" class="cmp-i">C · schematic</a>
  <a href="../" class="cmp-i">main</a>
</div>

<script src="app.js?v=1" defer></script>
</body>
</html>
