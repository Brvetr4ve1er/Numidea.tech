# Weekly dependency updates, as pull requests against the working branch
# (which is also the default branch; every push to it deploys once the gates
# in pages.yml are green). Each pull request runs the Check workflow.
#
# npm — there are only development dependencies (Playwright, axe-core,
#   html-validate, sharp); the site itself loads none (check.mjs 15c). Minor
#   and patch updates of axe-core, html-validate and sharp arrive as one
#   grouped pull request; a major version comes on its own.
#   Playwright is left out of the group, so every Playwright update is its
#   own pull request: a new version brings a new Chromium, which can move the
#   browser gates' results, and scripts/lib/serve.mjs prefers a pre-installed
#   Chromium where one exists (LOCAL_CHROME). CI installs the browser that
#   matches the locked version.
# github-actions — every action is pinned to a commit SHA with its version in
#   a comment; Dependabot moves both.
#
# A release must be a week old before it is proposed (cooldown), so a
# hijacked package version is usually caught and pulled before it reaches
# this repository. Security updates are not delayed.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "claude/numidea-labs-landing-c4jokc"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Africa/Algiers"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["playwright"]   # its own pull request (header)
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "claude/numidea-labs-landing-c4jokc"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Africa/Algiers"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"
