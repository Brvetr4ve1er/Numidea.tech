name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the working
# branch. The site is plain HTML/CSS/JS; the only "build" is staging the
# publishable files (scripts/site.mjs DEPLOY) into _site/, so internal folders
# (knowledge-base/, audit/, scripts/, BRAND.md…) are never served. The
# repository invariants run first: a failing check blocks the deploy.

on:
  push:
    branches: ["claude/numidea-labs-landing-c4jokc"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already deploying is never cancelled (a
# Pages deploy cut off mid-flight can fail or leave the release half-done);
# newer pushes wait, and of those only the latest queued one runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check repository invariants
        run: node scripts/check.mjs && node scripts/themes-check.mjs

      - name: Stage publishable files into _site/
        run: node scripts/stage-site.mjs

      - name: Configure Pages (auto-enable with Actions as the source)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
