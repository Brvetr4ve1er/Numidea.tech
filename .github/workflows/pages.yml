name: GitHub Pages forward

# The GitHub Pages address (scripts/site.mjs PAGES_BASE) is no longer a copy
# of the site. It publishes two small pages (scripts/pages-forward.mjs) that
# send every path to the same path on the canonical site (BASE) and tell
# search engines not to index them.
#
# Why: the mirror's deploy ran every gate first (about 27 minutes even with
# the gates side by side) and has not finished since 2026-10-25 (the billing
# lock, then cancelled at its 45-minute limit), so Pages kept serving the
# 25 October build: a public duplicate, months behind, that search engines
# could index. The gates now run where they belong: check.yml on every push
# and pull request, all of them nightly, and `npm run verify` before a
# publish (RELEASE.md). This workflow runs no gate because it publishes
# nothing of the site.
#
# It runs when the forward itself can change (the script, the addresses in
# site.mjs, this file) and on demand. About a minute. The owner can instead
# switch Pages off (Settings → Pages → Unpublish site); then this workflow
# has nothing to deploy to and can be deleted.
#
# Every action is pinned to a commit SHA, its version in the comment;
# Dependabot (.github/dependabot.yml) proposes the updates.

on:
  push:
    branches: ["claude/numidea-labs-landing-c4jokc"]
    paths: ["scripts/pages-forward.mjs", "scripts/site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a Pages deploy cut off mid-flight can fail.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Write the forward pages into _site/
        run: node scripts/pages-forward.mjs _site

      - name: Configure Pages (auto-enable with Actions as the source)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
