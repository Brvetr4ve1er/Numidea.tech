# Netlify — optional mirror of the GitHub Pages build.
# The "build" only stages the publishable files (scripts/site.mjs DEPLOY) into
# _site/, so internal folders (knowledge-base/, audit/, scripts/…) are never
# served. No dependencies are installed for it.
[build]
  command = "node scripts/stage-site.mjs"
  publish = "_site"

[build.environment]
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Mirror of vercel.json: immutable fingerprinted assets + security headers.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"   # workspacehq/ embeds its own same-origin pages
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
