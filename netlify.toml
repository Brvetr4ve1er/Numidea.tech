# Netlify — optional mirror of the GitHub Pages build.
# The build runs the same invariants as pages.yml (check + themes-check; a
# failure stops the deploy), then stages only the publishable files
# (scripts/site.mjs DEPLOY) into _site/, so internal folders (knowledge-base/,
# audit/, scripts/…) are never served. The build command itself needs no
# packages, and package.json declares only devDependencies, so NPM_FLAGS
# tells Netlify's install step (run before the build for any repository with
# a package.json) to leave them out: nothing to download, nothing to audit.
# None of them downloads a browser on install today (Playwright fetches
# browsers only through `npx playwright install`);
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stays as a guard should a version add one.
[build]
  command = "node scripts/check.mjs && node scripts/themes-check.mjs && node scripts/stage-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Mirror of vercel.json (check.mjs 16 holds the two "/*" blocks to the same
# headers). Assets, the hub's art and the WorkspaceHQ embed (the heaviest
# files published: its audio, model and vendor code) are cached for a day,
# not "immutable": only the CSS/JS links carry ?v= stamps, and images, the CV
# and og.jpg are regenerated under the same names (npm run shots, og). Plus
# security headers. Each page carries its own exact
# Content-Security-Policy meta (scripts/lib/csp.mjs); the header policy is
# the union of every page's meta (both kinds here: Netlify joins two matching
# values of one header with a comma, so it cannot give the embeds their own)
# plus what a meta cannot carry: frame-ancestors, upgrade-insecure-requests
# and reporting. The browser enforces both, so the header is never tighter
# than a meta. npm run csp writes the generated line (scripts/lib/csp-header.mjs).
# /api/csp-report exists on Vercel only: here the reports go nowhere.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/bible/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/workspacehq/embed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"   # workspacehq/ embeds its own same-origin pages
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # >>> generated by npm run csp (scripts/lib/csp-header.mjs): do not edit by hand
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'unsafe-eval' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw=' 'sha256-3P20+iQvxEEWOzVber4UZojHdHm1Txg9KVvpwleoMaY=' 'sha256-4yDH5HSQ2b8aZK6u6GGieL4Qwws4R5ExePml6hTwRn4=' 'sha256-5WzPqdLZ4m2J2s+wiVSfLUFLxoKARN5uJpyrr9Ytghw=' 'sha256-5f/GLvXTt5ei1JutIYbmY8h4kf96tCYFwN85CWFf+74=' 'sha256-6HkJyK9+5R2fOh/cJ9sUF2wNTkEzPj9tc/TgSDNuovM=' 'sha256-6NEHckFDJWfjZoYf2p00ooB1ehGS149Kd+N7SPkJiMw=' 'sha256-IgvAKE5wARI4KBrnqgf5qxTiIpASxEIZXPWAcIHttTQ=' 'sha256-KnJJ4fG/HO1sE7Ya57IE12Buvk9jLIKk7wZyG89PjV4=' 'sha256-QyPO5vP7qVNUE6dCQIDlrD3hfchM/E6NUh7r0HZ7n20=' 'sha256-R5R2cAZ4TmMqCaeF62vMuLRUd0LF8wmyABrD+llzAOE=' 'sha256-SGw6fs6rOZ7Ht23rkkAygArC7VHkAAQYJNvxKPXYXjY=' 'sha256-SN2VGi+YGu093+mOtytR6KD5bDg/W22aVc6UKlfVim8=' 'sha256-SmaNGeshnDHfTO+2Y/WsBKWB4MDNg1lijn1AXHYucSI=' 'sha256-Y3b/jNxVaYDxFhPVNHbwismSu2WPki64TWiEeessMtk=' 'sha256-YKRBUhTjDMqGzmBlvPc1gxQtJiyk8ybpS7jOBMbkEYs=' 'sha256-Z+V3d/hfY+7hn4Rpk+h93RTcUfDQnpe7026Mgom4SE0=' 'sha256-daCUEe/qrk4nSvSf7yzQ13yL1w9lRW84V9VcXoIFjJQ=' 'sha256-hH1+2JbT++0v50sfF6JjvQA3iFE/NxtUhS8uLkVq5TI=' 'sha256-hzX9paR3W0DDJkfgMf/v9R4W+AUBP398AcBqDOMNf9o=' 'sha256-jqvmeaJzhI0avE/Byblgel+6lAUwtfzShFKt7DLnhME=' 'sha256-kgIOvJ+q1H/ienL0+Xxo/uGoGlTmmfHeY2RqfbUgXLs=' 'sha256-lF0hMshay9uDlRQjCDDESPdw0lUObfjJpO/6cPf8J80=' 'sha256-mj8TfmLglFxhQtU0ovRRl0qAd7PnRa7BZjmQumBxA0c=' 'sha256-nmZObUibG4ANek0nhaebc4TtTdHI0jwZCT0jpR5WmBU=' 'sha256-pNSbGuIwFpGN7NxzBVxQS6Mw1uugcIV9CO60iSfmJbI=' 'sha256-qHgECMQ9Tz7WiEepwm1dZTbuzI+5mXJGlDplCuLGP3Q=' 'sha256-slqQEChFYxYW12Tgq1tnNuuMcF/rFAy5e7+Ucl6mTcI=' 'sha256-snFh5GEGrmzjC4ricTk+4h9piUrI3/zOREr15I+LjzM=' 'sha256-uyklYA5ydiIYOFr2ycjNBbLJ5Qhws6XzAVdOh+YqdYI=' 'sha256-xBJd735SnCJ3mIHAo6eeCKgnbZYIwPZWgLaJdaiMtYs='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com blob:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.an