# Netlify — optional mirror of the GitHub Pages build.
# The build runs the same invariants as pages.yml (check + themes-check; a
# failure stops the deploy), then stages only the publishable files
# (scripts/site.mjs DEPLOY) into _site/, so internal folders (knowledge-base/,
# audit/, scripts/…) are never served. The build command itself needs no
# packages, and package.json declares only devDependencies, so NPM_FLAGS
# tells Netlify's install step (run before the build for any repository with
# a package.json) to leave them out: nothing to download, nothing to audit.
# None of them downloads a browser on install today (Playwright fetches
# browsers only through `npx playwright install`);
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stays as a guard should a version add one.
[build]
  command = "node scripts/check.mjs && node scripts/themes-check.mjs && node scripts/stage-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Mirror of vercel.json (check.mjs 16 holds the two "/*" blocks to the same
# headers). Assets, the hub's art and the WorkspaceHQ embed (the heaviest
# files published: its audio, model and vendor code) are cached for a day,
# not "immutable": only the CSS/JS links carry ?v= stamps, and images, the CV
# and og.jpg are regenerated under the same names (npm run shots, og). Plus
# security headers. Each page carries its own exact
# Content-Security-Policy meta (scripts/lib/csp.mjs); the header policy is
# the union of every page's meta (both kinds here: Netlify joins two matching
# values of one header with a comma, so it cannot give the embeds their own)
# plus what a meta cannot carry: frame-ancestors, upgrade-insecure-requests
# and reporting. The browser enforces both, so the header is never tighter
# than a meta. npm run csp writes the generated line (scripts/lib/csp-header.mjs).
# /api/csp-report exists on Vercel only: here the reports go nowhere.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/bible/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/workspacehq/embed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"   # workspacehq/ embeds its own same-origin pages
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"     # PayPal and WhatsApp open as full-page navigations, never popups we talk to
    Cross-Origin-Resource-Policy = "same-site"
    # >>> generated by npm run csp (scripts/lib/csp-header.mjs): do not edit by hand
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'unsafe-eval' 'sha256-/Q8h9X1IaEJ3JyoEaASxwKDl2XAl+2lxiedwvORBrz4=' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw=' 'sha256-0LtuLuKVBbVmxDSulEDAYLNiU642bu6Kxr2mMTo1gCc=' 'sha256-15joY8K732OF4Khx+rp6vDz8txF4NhCDUR+Kx6B0I+U=' 'sha256-4aAO/p6u9K6gUEjwWZAjEg1y8mSXhsDz7YCTRtD8T2s=' 'sha256-6HkJyK9+5R2fOh/cJ9sUF2wNTkEzPj9tc/TgSDNuovM=' 'sha256-A8z7LPul9GTBLI/oBKr3+Kyz1n7FlM7dzE/N+9K+UaM=' 'sha256-CbXjfQusv+zJhKI/sDHoQJtfBRfgLY/paL+Y6LmXFwI=' 'sha256-EGX+qDR3HhmMKM01Hb5sBBypTeZvbmz5/GeDtjXFBoI=' 'sha256-HbX7csG0d9/f1nJyq667N1tz4tz02n2PcZfreBgIgTM=' 'sha256-K0fguyPzltxvK0qt/Z2BUKLNnCMoaMyWTuchUJJ4EOk=' 'sha256-K64dNxerpjbdL9+QFPAIZLtz/sK7kWEbBNJsAhSXS3M=' 'sha256-KnJJ4fG/HO1sE7Ya57IE12Buvk9jLIKk7wZyG89PjV4=' 'sha256-MJq1uHkZnfi6Rtju2/Y7R2LtFZbCeCe+a1WP2h9HFUw=' 'sha256-Nqnn8clbgv+5l0PgxcTOldg8mkMKrFn4TvPL+rYUUGg=' 'sha256-NtsEniQR01t6WsYxIRBLfu/XC5nmHlgMkIRHY+K+WaY=' 'sha256-OOh+MU0sFgfdMMPCzqzC2hPUl05iVUBxQAU5MB5LhRU=' 'sha256-R5R2cAZ4TmMqCaeF62vMuLRUd0LF8wmyABrD+llzAOE=' 'sha256-SN2VGi+YGu093+mOtytR6KD5bDg/W22aVc6UKlfVim8=' 'sha256-SU7U3SVgIWhsmcFUV5E36zcUPzHzi99PP8IaZlwJcME=' 'sha256-SdfAbwT83eB9+KF0T2N4b4yyphtv5c07Y4HE8zQuQNw=' 'sha256-UBppzbm2zN8DjLLCalUesO3qXWC39jXyfkjmFdbq8Vc=' 'sha256-YKRBUhTjDMqGzmBlvPc1gxQtJiyk8ybpS7jOBMbkEYs=' 'sha256-ZjA0A1JVPCsLuQVuFuKhEtBKYYCGDuMosfobwNP3Uls=' 'sha256-dloXuaNLTNojI37gw9+2thpB5YpeE2HdodRh5IPRJAQ=' 'sha256-eefOVJfjz+ffQL+LGGDRwH9N0goAVZlFRd+cVJ1myVc=' 'sha256-irdS0xJ3CvNkw9o4G9wp9MYJmopPCe1hXIqLW6IYZOM=' 'sha256-jqvmeaJzhI0avE/Byblgel+6lAUwtfzShFKt7DLnhME=' 'sha256-kblYIFYjRb+kJOWvMKQRo0Y5FoH5tO7/v+xoKyfIAqU=' 'sha256-mNjEYjrwpXMefUeVNGNNUZxbzorM/reJ6+W/30HZBEI=' 'sha256-qxwmSqXhKvE/qQWsS4jCLxpuZ7RR5thMSwS3boaMYdQ=' 'sha256-tnguwLvaFqrrwyPoXWSImnkRnfKnMFy+qzOPFQE6Fgo=' 'sha256-yVeHNqQTRpk0JRFj4ZGC6maJV0vV1YlbfrNQvbb9X50=' 'sha256-zVSu06a7vNA+Mme/sOwkF3lfZ/17PXhr4mgik0+QDU0='; style-src 'self' 'unsafe-inline'; img-src 'self