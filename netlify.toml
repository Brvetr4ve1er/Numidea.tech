# Netlify — optional mirror of the GitHub Pages build.
# The build runs the same invariants as pages.yml (check + themes-check; a
# failure stops the deploy), then stages only the publishable files
# (scripts/site.mjs DEPLOY) into _site/, so internal folders (knowledge-base/,
# audit/, scripts/…) are never served. The build command itself needs no
# packages, and package.json declares only devDependencies, so NPM_FLAGS
# tells Netlify's install step (run before the build for any repository with
# a package.json) to leave them out: nothing to download, nothing to audit.
# None of them downloads a browser on install today (Playwright fetches
# browsers only through `npx playwright install`);
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stays as a guard should a version add one.
[build]
  command = "node scripts/check.mjs && node scripts/themes-check.mjs && node scripts/stage-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Mirror of vercel.json (check.mjs 16 holds the two "/*" blocks to the same
# headers). Assets, the hub's art and the WorkspaceHQ embed (the heaviest
# files published: its audio, model and vendor code) are cached for a day,
# not "immutable": only the CSS/JS links carry ?v= stamps, and images, the CV
# and og.jpg are regenerated under the same names (npm run shots, og). Plus
# security headers. Each page carries its own exact
# Content-Security-Policy meta (scripts/lib/csp.mjs); the header policy is
# the union of every page's meta (both kinds here: Netlify joins two matching
# values of one header with a comma, so it cannot give the embeds their own)
# plus what a meta cannot carry: frame-ancestors, upgrade-insecure-requests
# and reporting. The browser enforces both, so the header is never tighter
# than a meta. npm run csp writes the generated line (scripts/lib/csp-header.mjs).
# /api/csp-report exists on Vercel only: here the reports go nowhere.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/bible/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/workspacehq/embed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"   # workspacehq/ embeds its own same-origin pages
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # >>> generated by npm run csp (scripts/lib/csp-header.mjs): do not edit by hand
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'unsafe-eval' 'sha256-//VRLjiwlmEv7VLxFvDSqQxttJMXHw3ZBeyBC9MnFAw=' 'sha256-/wjP2jk99toqq09Dft+51LCxhqi7O2dFAGYFaGOxz04=' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw=' 'sha256-4aAO/p6u9K6gUEjwWZAjEg1y8mSXhsDz7YCTRtD8T2s=' 'sha256-5tQCmTva4DwwYb09fOOoLVYfMJaFC81wEf0n1SYNX3g=' 'sha256-6HkJyK9+5R2fOh/cJ9sUF2wNTkEzPj9tc/TgSDNuovM=' 'sha256-DKSXRfRcx565rTzYzZ8EAsjsXFX3Ce+N7lc/SmIj+QY=' 'sha256-DqQWs3ZqAj7Bslm3RuBSHq1aYPfvIFIyvB9mIlA3Hos=' 'sha256-EGX+qDR3HhmMKM01Hb5sBBypTeZvbmz5/GeDtjXFBoI=' 'sha256-HbX7csG0d9/f1nJyq667N1tz4tz02n2PcZfreBgIgTM=' 'sha256-HmV/p9S/sc3BXlP9RndrsutveNr1a6msaG3Lg60RiXY=' 'sha256-HoHbNVQNE27msB4vmtVe71zdDV/oC5z5a3ERY2WjdZY=' 'sha256-KnJJ4fG/HO1sE7Ya57IE12Buvk9jLIKk7wZyG89PjV4=' 'sha256-Nqnn8clbgv+5l0PgxcTOldg8mkMKrFn4TvPL+rYUUGg=' 'sha256-NtsEniQR01t6WsYxIRBLfu/XC5nmHlgMkIRHY+K+WaY=' 'sha256-R5R2cAZ4TmMqCaeF62vMuLRUd0LF8wmyABrD+llzAOE=' 'sha256-SN2VGi+YGu093+mOtytR6KD5bDg/W22aVc6UKlfVim8=' 'sha256-SdfAbwT83eB9+KF0T2N4b4yyphtv5c07Y4HE8zQuQNw=' 'sha256-XFANXwMma0oqBCraNTe60KaoOZkQBV1ot4aSx+6swck=' 'sha256-YKRBUhTjDMqGzmBlvPc1gxQtJiyk8ybpS7jOBMbkEYs=' 'sha256-c9GBK/gho0agpM5K5hh+dp8giynJEDTQudTD3ifTI84=' 'sha256-cviHdsO2KpjgIsQHYvc4Rvi1Op4cKXuBw+xEWn7FHI8=' 'sha256-dloXuaNLTNojI37gw9+2thpB5YpeE2HdodRh5IPRJAQ=' 'sha256-eefOVJfjz+ffQL+LGGDRwH9N0goAVZlFRd+cVJ1myVc=' 'sha256-hnInrCkdLXc6IRuzeqMxCiU/y1V+GwOW95mwYb0aMUk=' 'sha256-htg91joNeUTnwBpFwIkevTbvpBG6Cqdfve6SW9pj+cs=' 'sha256-irdS0xJ3CvNkw9o4G9wp9MYJmopPCe1hXIqLW6IYZOM=' 'sha256-iwCmPgEYS7X3g/HAM4VpWOakRuGAe2hjoqjH9Se7znw=' 'sha256-jqvmeaJzhI0avE/Byblgel+6lAUwtfzShFKt7DLnhME=' 'sha256-kabnOnaxJ9G72taFsVibDWwARCaDtqrBh5My+VgD2go=' 'sha256-mNjEYjrwpXMefUeVNGNNUZxbzorM/reJ6+W/30HZBEI=' 'sha256-tnguwLvaFqrrwyPoXWSImnkRnfKnMFy+qzOPFQE6Fgo=' 'sha256-yaSUpMJUXQt7lpjOGhfjlv/1FU2oLXdBp5DYKrgKivA=' 'sha256-zLcP7ypvWioQjPk1FVSN1dEGltY4KuJQsEhUzLZHMPI='; style-src 'self' 'unsafe-inline'; img-src 'self