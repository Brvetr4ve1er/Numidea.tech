# Netlify — optional mirror of the GitHub Pages build.
# The build runs the same invariants as pages.yml (check + themes-check; a
# failure stops the deploy), then stages only the publishable files
# (scripts/site.mjs DEPLOY) into _site/, so internal folders (knowledge-base/,
# audit/, scripts/…) are never served. The build command itself needs no
# packages, and package.json declares only devDependencies, so NPM_FLAGS
# tells Netlify's install step (run before the build for any repository with
# a package.json) to leave them out: nothing to download, nothing to audit.
# None of them downloads a browser on install today (Playwright fetches
# browsers only through `npx playwright install`);
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stays as a guard should a version add one.
[build]
  command = "node scripts/check.mjs && node scripts/themes-check.mjs && node scripts/stage-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Mirror of vercel.json (check.mjs 16 holds the two "/*" blocks to the same
# headers). Assets, the hub's art and the WorkspaceHQ embed (the heaviest
# files published: its audio, model and vendor code) are cached for a day,
# not "immutable": only the CSS/JS links carry ?v= stamps, and images, the CV
# and og.jpg are regenerated under the same names (npm run shots, og). Plus
# security headers. Each page carries its own exact
# Content-Security-Policy meta (scripts/lib/csp.mjs); the header policy is
# the union of every page's meta (both kinds here: Netlify joins two matching
# values of one header with a comma, so it cannot give the embeds their own)
# plus what a meta cannot carry: frame-ancestors, upgrade-insecure-requests
# and reporting. The browser enforces both, so the header is never tighter
# than a meta. npm run csp writes the generated line (scripts/lib/csp-header.mjs).
# /api/csp-report exists on Vercel only: here the reports go nowhere.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hub/bible/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/workspacehq/embed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"   # workspacehq/ embeds its own same-origin pages
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # >>> generated by npm run csp (scripts/lib/csp-header.mjs): do not edit by hand
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'unsafe-eval' 'sha256-+soBNfHl+UCdPimAGnPFIucClEq4wOJLFeD6tkwvr58=' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw=' 'sha256-4aAO/p6u9K6gUEjwWZAjEg1y8mSXhsDz7YCTRtD8T2s=' 'sha256-6HkJyK9+5R2fOh/cJ9sUF2wNTkEzPj9tc/TgSDNuovM=' 'sha256-7ta5j7xFd9q62M6gdkh+4OdiYJfzDS3ADeSpUw/Cnx0=' 'sha256-C30AtI0wmvEdaMi1UMYuJmGTuyz6Vufzplazp/XjpDY=' 'sha256-EGX+qDR3HhmMKM01Hb5sBBypTeZvbmz5/GeDtjXFBoI=' 'sha256-HbX7csG0d9/f1nJyq667N1tz4tz02n2PcZfreBgIgTM=' 'sha256-IDh1W8RNPNVfZtkb2yjs28F0v/DlXWnpAm3S9um94ZI=' 'sha256-IgvAKE5wARI4KBrnqgf5qxTiIpASxEIZXPWAcIHttTQ=' 'sha256-KnJJ4fG/HO1sE7Ya57IE12Buvk9jLIKk7wZyG89PjV4=' 'sha256-L1EfGNdRzHnYR134uPdRHCFvGRUGoW77K/Y0an1C7cI=' 'sha256-Nqnn8clbgv+5l0PgxcTOldg8mkMKrFn4TvPL+rYUUGg=' 'sha256-NtsEniQR01t6WsYxIRBLfu/XC5nmHlgMkIRHY+K+WaY=' 'sha256-QBjFP5wjuFn8Hei1SQkgimCLzt9dCEuLeOXH4+7Hhmg=' 'sha256-R5R2cAZ4TmMqCaeF62vMuLRUd0LF8wmyABrD+llzAOE=' 'sha256-SN2VGi+YGu093+mOtytR6KD5bDg/W22aVc6UKlfVim8=' 'sha256-SdfAbwT83eB9+KF0T2N4b4yyphtv5c07Y4HE8zQuQNw=' 'sha256-WeHxLtsKc2EH9HCsufVpFufpZ/nkFzPb6DmEQ6cxsiU=' 'sha256-YKRBUhTjDMqGzmBlvPc1gxQtJiyk8ybpS7jOBMbkEYs=' 'sha256-dRyXCCrhVv2EOzoU2BRj9tO5ZaFsczEnNF5o6ja6LZ0=' 'sha256-eefOVJfjz+ffQL+LGGDRwH9N0goAVZlFRd+cVJ1myVc=' 'sha256-irdS0xJ3CvNkw9o4G9wp9MYJmopPCe1hXIqLW6IYZOM=' 'sha256-jqvmeaJzhI0avE/Byblgel+6lAUwtfzShFKt7DLnhME=' 'sha256-knpLOFmiw4pzjJFhMvA04ofoEJbuj47VwDQwnPpGbMI=' 'sha256-kuXs47751VfvZuojzAoIekzWLITuob3XwxtdIZ7mOZw=' 'sha256-mNjEYjrwpXMefUeVNGNNUZxbzorM/reJ6+W/30HZBEI=' 'sha256-r6Echk4l476oNhe0Dch0+uYc3AozST++YRh5t5bEDcw=' 'sha256-rVZ2oS4VInLkdKqVqspZIgNOyPMLBqskIyrmDVwOQ1A=' 'sha256-tJ6bMlVmfJkKBwsNeYMCbbZqwbwp0OWvE5bPx98/KzQ=' 'sha256-tnguwLvaFqrrwyPoXWSImnkRnfKnMFy+qzOPFQE6Fgo=' 'sha256-v6fvFvdxSDKsWtHDpqa9MoKR287IdX76/uPgDWG3iUw=' 'sha256-vgWhFno8tRxupvTmX+uZNkAtSjNb0pO0kiOjYJcYTdY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googl