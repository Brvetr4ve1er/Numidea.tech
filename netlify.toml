# Netlify — optional mirror of the GitHub Pages build.
# The build runs the same invariants as pages.yml (check + themes-check; a
# failure stops the deploy), then stages only the publishable files
# (scripts/site.mjs DEPLOY) into _site/, so internal folders (knowledge-base/,
# audit/, scripts/…) are never served. The build command itself needs no
# packages, but Netlify installs package.json's dependencies (devDependencies
# included) before running it, as it does for any repository with a
# package.json. None of them downloads a browser on install today (Playwright
# fetches browsers only through `npx playwright install`);
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stays as a guard should a version add one.
[build]
  command = "node scripts/check.mjs && node scripts/themes-check.mjs && node scripts/stage-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Mirror of vercel.json. Assets are cached for a day, not "immutable": only
# the CSS/JS links carry ?v= stamps, and images, the CV and og.jpg are
# regenerated under the same names (npm run shots, og). Plus security headers.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"   # workspacehq/ embeds its own same-origin pages
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
